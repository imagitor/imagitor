# FAQ List
faqs:
  - question: "Is Imagitor free to use?"
    answer: "Yes. Imagitor is absolutely free to download and use, with a comprehensive set of professional features available at no cost. However, you can upgrade to a paid version for an ad-free premium experience and unlock advanced tools."
  - question: "Does Imagitor have a video editor?"
    answer: "Yes. Imagitor now includes a full video editor — the first ever Urdu video editor. Edit videos on a multi-track timeline: trim and split clips, add transitions and filters, and overlay animated Urdu text, stickers, and background music."
  - question: "Can I add Urdu text to videos?"
    answer: "Yes. You can overlay animated Urdu, Arabic, and Persian text on your videos using the same Nastaliq fonts and text effects as the design editor, with animations like fade, slide, and typewriter."
  - question: "What is AI Slides?"
    answer: "AI Slides turns a text prompt into a ready-made slideshow video. Describe your topic and Imagitor generates styled text slides that you can edit, re-time, and export as a video."
  - question: "Can I add music to my videos?"
    answer: "Yes. Imagitor includes a free background music library for your videos. Pick a track, drop it on the timeline, and trim it to fit your video."
  - question: "What is included in Imagitor Premium?"
    answer: "Imagitor Premium unlocks the full potential of the app. It provides an ad-free experience, removes watermarks from exports, unlocks Full HD 1080p video export, and gives you unlimited project saves, unlimited undo/redo steps, and access to premium templates and advanced Harf settings. You can unlock it via a one-time purchase or subscription."
  - question: "Do I need an account to start designing?"
    answer: "No account is required. You can begin designing the moment the app is installed."
  - question: "Can I use my own fonts?"
    answer: "Yes. You can import and use your own custom fonts to fully personalize your designs."
  - question: "Is Imagitor available for iOS?"
    answer: "Yes. Imagitor is available on both Android and iOS, through the Google Play Store and the Apple App Store."
  - question: "Can I save my projects to edit later?"
    answer: "Yes. You can save any design as a project and continue editing it whenever you like."

