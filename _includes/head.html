<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">


	<title class="pageTitle">{% if page.title %}{{ page.title }} | {{ site.app_name }}{% else %}{{ site.page_title }}{% endif %}</title>
	<meta name="description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | truncatewords: 30 | strip_newlines }}{% else %}{{ site.app_description }}{% endif %}">
	<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

	<link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">
	<link rel="llms-txt" href="/llms.txt">
	<link rel="shortcut icon" href="{{ site.app_icon }}">

	<!-- SEO & Open Graph Meta Tags -->
	<meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.app_name }}{% else %}{{ site.page_title }}{% endif %}">
	<meta property="og:description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | truncatewords: 30 | strip_newlines }}{% else %}{{ site.app_description }}{% endif %}">
	<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
	<meta property="og:url" content="{{ site.url }}{{ page.url | replace:'index.html','' }}">
	<meta property="og:image" content="{{ site.url }}{{ site.app_icon }}">

	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.app_name }}{% else %}{{ site.page_title }}{% endif %}">
	<meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | truncatewords: 30 | strip_newlines }}{% else %}{{ site.app_description }}{% endif %}">
	<meta name="twitter:image" content="{{ site.url }}{% if page.image %}{{ page.image }}{% else %}{{ site.app_icon }}{% endif %}">
	{% if site.twitter_username %}
	<meta name="twitter:site" content="@{{ site.twitter_username }}">
	{% endif %}

	<!-- Structured Data for Search Engines -->
	<script type="application/ld+json">
	[
	  {
	    "@context": "https://schema.org",
	    "@type": "SoftwareApplication",
	    "name": "{{ site.app_name }}",
	    "operatingSystem": "ANDROID, iOS",
	    "applicationCategory": "DesignApplication",
	    "description": "{{ site.app_description }}",
	    "offers": {
	      "@type": "Offer",
	      "price": "0",
	      "priceCurrency": "USD"
	    }
	  },
	  {
	    "@context": "https://schema.org",
	    "@type": "WebSite",
	    "name": "{{ site.app_name }}",
	    "url": "{{ site.url }}"
	  },
	  {
	    "@context": "https://schema.org",
	    "@type": "Organization",
	    "name": "{{ site.your_name }}",
	    "url": "{{ site.url }}",
	    "logo": "{{ site.url }}{{ site.app_icon }}",
	    "sameAs": [
	      "{{ site.your_link }}"{% if site.facebook_username %},
	      "https://facebook.com/{{ site.facebook_username }}"{% endif %}{% if site.instagram_username %},
	      "https://instagram.com/{{ site.instagram_username }}"{% endif %}{% if site.twitter_username %},
	      "https://twitter.com/{{ site.twitter_username }}"{% endif %}{% if site.youtube_username %},
	      "https://youtube.com/{{ site.youtube_username }}"{% endif %}
	    ]
	  }{% if site.faqs %},
	  {
	    "@context": "https://schema.org",
	    "@type": "FAQPage",
	    "mainEntity": [
	      {% for faq in site.faqs %}
	      {
	        "@type": "Question",
	        "name": "{{ faq.question }}",
	        "acceptedAnswer": {
	          "@type": "Answer",
	          "text": "{{ faq.answer }}"
	        }
	      }{% if forloop.last == false %},{% endif %}
	      {% endfor %}
	    ]
	  }
	  {% endif %}
	]
	</script>

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
	<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@300;400;500;600;700&family=Rufina:wght@400;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="/main.css">
	<style>
		@font-face {
			font-family: 'MehrNastaliq';
			src: url('/assets/fonts/Mehr_Nastaliq_Web_2.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}

		.urdu-content, .urdu-content h1, .urdu-content h2, .urdu-content h3, .urdu-content a {
			direction: rtl;
			text-align: right !important;
			font-family: 'MehrNastaliq', Arial, sans-serif !important;
			letter-spacing: normal !important;
		}

		.urdu-content .post-content {
			font-size: 1.3em;
		}
	</style>
</head>
